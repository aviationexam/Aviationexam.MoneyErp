name: Nuget Package Deploy

# The Azure release pipeline starts this workflow after it attaches the GraphQL schema to the GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the GitHub release to build and publish'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
      id-token: write # nuget.org trusted publishing exchanges the GitHub OIDC token for a short-lived API key
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Setup .Net
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.x
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.1
        with:
          versionSpec: '6.x'
      - name: Use GitVersion
        id: gitversion # step id used as reference for output values
        uses: gittools/actions/gitversion/execute@v4.7.1
      - run: |
          echo "MajorMinorPatch: ${{ steps.gitversion.outputs.MajorMinorPatch }}"
          echo "FullSemVer: ${{ steps.gitversion.outputs.FullSemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"
      - name: Check the version matches the tag
        run: |
          if [ "${{ steps.gitversion.outputs.FullSemVer }}" != "$RELEASE_TAG" ]; then
            echo "::error::GitVersion computed ${{ steps.gitversion.outputs.FullSemVer }} for the tag $RELEASE_TAG"
            exit 1
          fi
      - name: Download schema.graphql from the release
        run: gh release download "$RELEASE_TAG" --pattern schema.graphql --dir src/Aviationexam.MoneyErp.Graphql
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tool restore
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore --nologo
      - name: Build with .Net
        run: dotnet build --configuration Release --no-restore --nologo "-p:Version=${{ steps.gitversion.outputs.FullSemVer }}" -p:ContinuousIntegrationBuild=true
      - name: Pack with .Net
        run: |
          dotnet pack src/Aviationexam.MoneyErp.Common/Aviationexam.MoneyErp.Common.csproj --nologo --no-build --configuration Release --output nuget-packages -p:PackageVersion=${{ steps.gitversion.outputs.FullSemVer }} -p:ContinuousIntegrationBuild=true
          dotnet pack src/Aviationexam.MoneyErp.Graphql/Aviationexam.MoneyErp.Graphql.csproj --nologo --no-build --configuration Release --output nuget-packages -p:PackageVersion=${{ steps.gitversion.outputs.FullSemVer }} -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v7
        with:
          name: Nuget-packages-${{ steps.gitversion.outputs.FullSemVer }}
          path: nuget-packages
      - name: Configure Github Nuget Feed
        run: dotnet nuget add source --name github https://nuget.pkg.github.com/aviationexam/index.json
      - name: Push package to Github Packages
        run: dotnet nuget push 'nuget-packages/*.nupkg' --api-key ${{ secrets.GITHUB_TOKEN  }} --source github --skip-duplicate
      # The temporary API key is valid for one hour, so request it right before pushing
      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push package to Nuget
        run: dotnet nuget push 'nuget-packages/*.nupkg' --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

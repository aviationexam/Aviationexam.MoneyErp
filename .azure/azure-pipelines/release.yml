name: Release-$(Date:yyyyMMdd)$(Rev:.r)

# This pipeline fetches the GraphQL schema and attaches it to the GitHub release.
# Then it starts the GitHub workflow that builds and publishes the packages.
# nuget.org trusted publishing does not accept Azure Pipelines tokens.

trigger:
  tags:
    include:
      - '*'

pr: none

pool:
  name: 'Private Docker'
  demands:
    - docker

stages:
- stage: GraphqlSchema
  displayName: GraphQL schema
  jobs:
  - job: Release
    displayName: Attach the schema and start the GitHub release
    steps:
      - checkout: self
        clean: true

      - template: ../templates/persist-parameter-as-file.yml
        parameters:
          file: $(MONEYERP_ENDPOINT_CERTIFICATE)
          fileExt: 'pem'
          stepName: persist_client_secret

      - template: ../templates/get-access-token.yml
        parameters:
          tokenServerUrl: $(MONEYERP_ENDPOINT)
          selfSignedServerCert: $(persist_client_secret.file_path)
          clientId: $(MONEYERP_CLIENT_ID)
          clientSecret: $(MONEYERP_CLIENT_SECRET)
          stepName: get_token

      - template: ../templates/fetch-graphql-schema.yml
        parameters:
          endpoint: $(MONEYERP_ENDPOINT)
          selfSignedServerCert: $(persist_client_secret.file_path)
          access_token: $(get_token.access_token)
          stepName: fetch_schema
          workingDirectory: src/Aviationexam.MoneyErp.Graphql

      - task: PublishPipelineArtifact@1
        displayName: 'Publish schema.json'
        inputs:
          targetPath: 'src/Aviationexam.MoneyErp.Graphql/schema.json'
          artifact: 'GraphQL-JSON'
          publishLocation: 'pipeline'

      - task: PublishPipelineArtifact@1
        displayName: 'Publish schema.graphql'
        inputs:
          targetPath: 'src/Aviationexam.MoneyErp.Graphql/schema.graphql'
          artifact: 'GraphQL'
          publishLocation: 'pipeline'

      - script: |
          gh release upload "$(Build.SourceBranchName)" "src/Aviationexam.MoneyErp.Graphql/schema.json" --clobber
          gh release upload "$(Build.SourceBranchName)" "src/Aviationexam.MoneyErp.Graphql/schema.graphql" --clobber
        displayName: Attach GraphQL resources to the release
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)

      - script: gh workflow run release.yml --field "tag=$(Build.SourceBranchName)"
        displayName: Start the GitHub release workflow
        env:
          GITHUB_TOKEN: $(GITHUB_TOKEN)
